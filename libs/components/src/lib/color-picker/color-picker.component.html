<div
  class="value"
  #valueElement
  (click)="openPopup()"
  [class.value-active]="opened"
  >
  <div class="value-color" [style.background-color]="displayHex">
    &nbsp;
    <rw-icon class="icon" icon="keyboard_arrow_down" size="small" />
  </div>
</div>
<rw-dropdown
  #dropdown
  class="dropdown"
  [bindElement]="valueElement"
  [closeByClickElement]="false"
  [displayBackground]="true"
  (closed)="opened = false"
  >
  <ng-template #dropdownContent>
    <div class="color-items" (click)="$event.stopPropagation()">
      <div class="color-items-line">
        @for (swatch of baseColors; track swatch.getHex()) {
          <div
            class="color-item"
            [style.background-color]="swatch.getHex()"
            (click)="selectColor(swatch, $event)"
          ></div>
        }
      </div>
      <div class="color-horizontal-line"></div>
      @for (colorLine of colors; track $index) {
        <div class="color-items-line">
          @for (swatch of colorLine; track swatch.getHex()) {
            <div
              class="color-item"
              [style.background-color]="swatch.getHex()"
              (click)="selectColor(swatch, $event)"
            ></div>
          }
        </div>
      }
      <div class="color-horizontal-line"></div>
      <rw-text-input [ngModel]="textValue"
        (ngModelChange)="parseColor($event)"
        [borderless]="true"
        [live]="true"
       />
    </div>
  </ng-template>
</rw-dropdown>

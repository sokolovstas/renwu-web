<div
  #avatarEl
  class="avatar"
  [style.width]="size"
  [style.height]="size"
  [class.add]="newUser"
  [class.editable]="editable"
  [rwTooltip]="editable ? '' : name"
  tooltipDirection="bottom"
  [tooltipDisabled]="!showTooltip || editable"
  (click)="onAvatarClick()"
  >
  @if ((!newUser && !avatarUrl) || error) {
    <div
      class="initials"
      [style.background-color]="color"
      [style.color]="textColor"
      >
      <div class="initials-text" [style.fontSize]="fontSize">
        {{ initials }}
      </div>
    </div>
  }
  @if (!newUser && !!avatarUrl && !error) {
    <div
      class="initials"
      [style.background-color]="'#fff'"
      >
      <img src="{{ avatarUrl }}" class="image" (error)="error = true" />
    </div>
  }

  @if (newUser) {
    <rw-icon icon="add" />
  }
  @if (editable) {
    <div class="edit-overlay">
      <rw-icon icon="picture" size="small" />
    </div>
  }
  @if (showOnline && !editable) {
    <div class="status" [class.online]="online"></div>
  }
</div>

<renwu-page-with-sidebar>
  <div sidebar>
    <div class="text-2xl p-4 pt-0 flex flex-row font-extralight">
      <a class="flex" routerLink="./">{{ 'boards.listTitle' | transloco }}</a>
    </div>
    <ul class="flex flex-col overflow-auto w-full mb-4">
      @for (board of boards | async; track board.id) {
        <li>
          <a
            class="flex p-4"
            [routerLink]="[board.id]"
            routerLinkActive="router-link-active"
            >{{ board.title }}</a
          >
        </li>
      }
    </ul>
  </div>
  <router-outlet />
</renwu-page-with-sidebar>

@if (item) {
  @if (isGroup) {
    <div
      class="timeline-item-group"
      [class.timeline-row-highlight]="rowHighlighted"
      [style.height.px]="issueRowHeightPx()"
      (mouseenter)="onRowHover(true)"
      (mouseleave)="onRowHover(false)"
    >
      <!-- group row placeholder - no bar -->
    </div>
  } @else if (width > 0) {
    <div
      class="timeline-item"
      [class.timeline-row-highlight]="rowHighlighted"
      [class.timeline-item-dimmed]="dimmed"
      [style.height.px]="issueRowHeightPx()"
      [style.width.px]="lineWidth"
      (mouseenter)="onRowHover(true)"
      (mouseleave)="onRowHover(false)"
    >
      <div
        class="bar"
        [class.auto-scheduled]="isAutoScheduled"
        [class.bar-in-parent-scope]="inParentScope"
        [class.bar-has-childs]="hasChildIssues"
        [style.height.px]="barHeightPx()"
        [style.marginLeft.px]="offsetForItem"
        [style.width.px]="width"
        [style.background]="barColor"
        (click)="onItemClick()"
      >
        <div
          class="progress"
          [style.width.px]="widthProgress"
          [style.background]="progressColor"
        ></div>
        <span class="bar-title-inside">{{ titleLabel }}</span>
      </div>
      <div
        class="bar-create-actions"
        [style.left.px]="offsetForItem"
        [style.width.px]="width"
        [style.height.px]="barHeightPx()"
      >
        <button
          type="button"
          class="bar-create-btn bar-create-btn--prev"
          title="Previous"
          (click)="onCreateClick($event, 'prev')"
        >
          <rw-icon icon="add-bold" size="small" />
        </button>
        <button
          type="button"
          class="bar-create-btn bar-create-btn--next"
          title="Next"
          (click)="onCreateClick($event, 'next')"
        >
          <rw-icon icon="add-bold" size="small" />
        </button>
        <button
          type="button"
          class="bar-create-btn bar-create-btn--parent"
          title="Parent"
          (click)="onCreateClick($event, 'parent')"
        >
          <rw-icon icon="add-bold" size="small" />
        </button>
        <button
          type="button"
          class="bar-create-btn bar-create-btn--child"
          title="Child"
          (click)="onCreateClick($event, 'child')"
        >
          <rw-icon icon="add-bold" size="small" />
        </button>
      </div>
      @if (showTitleRight) {
        <span class="bar-title-right">{{ titleLabel }}</span>
      }
    </div>
  } @else {
    <div
      class="timeline-item-empty"
      [class.timeline-row-highlight]="rowHighlighted"
      [style.height.px]="issueRowHeightPx()"
      (mouseenter)="onRowHover(true)"
      (mouseleave)="onRowHover(false)"
    >
    </div>
  }

  @if (item._SHOWCHILDS !== false && item.childs?.length) {
    @for (child of item.childs; track child.id || child.title; let ci = $index) {
      <renwu-timeline-item
        [item]="child"
        [stripeIndex]="childStripeIndex(ci)"
        [highlightedId]="highlightedId"
        [dimmed]="dimmed"
        [issueRowHeightPx]="issueRowHeightPx()"
        [scale]="scale"
        [dateStart]="dateStart"
        [dateEnd]="dateEnd"
        [hours24InDay]="hours24InDay"
        [showTitleRight]="showTitleRight"
        [containerTop]="containerTop"
        [selectMilestone]="selectMilestone"
        [timelineGraphContentBound]="timelineGraphContentBound"
        [depth]="depth + 1"
        [inParentScope]="hasChildIssues"
        [treeRevision]="treeRevision"
        (selected)="selected.emit($event)"
        (scrollTo)="scrollTo.emit($event)"
        (createRelated)="createRelated.emit($event)"
        (issueLaidOut)="issueLaidOut.emit($event)"
        (scrollRight)="scrollRight.emit()"
        (scrollLeft)="scrollLeft.emit()"
        (increaseWidth)="increaseWidth.emit($event)"
      />
    }
  }
}

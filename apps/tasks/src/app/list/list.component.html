<renwu-page
  title="{{ query()?.title }}"
  [breadcrumbs]="[{ title: 'tasks.filters' | transloco, url: '..', showSidebar: true }]"
  >
  <div subtitle>
    <renwu-query-builder [query]="queryString()"
      (queryChange)="updateQuery($event)"
     />
  </div>
  @if (allTask | async; as issues) {
    <renwu-issue-table
      class="w-full text-sm"
      [issues]="issues"
      (clicked)="issueClick($event)"
      [sortable]="true"
      [groupable]="true"
      [showExport]="true"
      [listOptions]="listOptions()"
      (listOptionsChange)="updateListOptions($event)"
      >
      <renwu-issue-status-bar header
        class="mb-2"
        [issues]="issues"
        [groupBy]="[listOptions().group.field]"
        (itemClick)="filterByBar($event)"
       />
    </renwu-issue-table>
  }
  <rw-button
    action
    [disabled]="!isDirty()"
    (clicked)="saveFilter()"
    >{{ 'tasks.save-filter' | transloco }}</rw-button
  >
</renwu-page>
